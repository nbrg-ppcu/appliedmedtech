name: Validate Session 10 notebook

on:
  push:
    branches: [session-10-protein-language-models]
    paths:
      - notebooks/session_10/ProteinLM_practice.ipynb
      - .github/workflows/validate-session-10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install a fresh CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install nbformat nbclient ipykernel numpy pandas matplotlib tqdm
      - name: Run all supplied cells with the real model and dataset
        run: |
          python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          source = Path("notebooks/session_10/ProteinLM_practice.ipynb")
          notebook = nbformat.read(source, as_version=4)
          nbformat.validate(notebook)
          notebook.cells.append(nbformat.v4.new_code_cell("""
          import platform
          from importlib.metadata import version
          assert embeddings.shape == (1000, model.config.hidden_size)
          assert np.isfinite(embeddings).all()
          assert umap_embeddings.shape == (1000, 2)
          assert np.isfinite(umap_embeddings).all()
          assert not any(embedding_dataset["Is Test"])
          assert np.array_equal(labels, np.asarray(embedding_dataset["Localization"]))
          assert all_logits.shape == (108, model.config.vocab_size)
          assert np.isfinite(heatmap).all()
          assert heatmap.shape == (20, 108)
          assert np.allclose(heatmap[wt_rows, np.arange(sequence_length)], 0)
          assert np.isclose(pll / sequence_length, mean_pll)
          assert not torch.any(scoring_input_ids == tokenizer.mask_token_id)
          assert torch.all((batched_input_ids == tokenizer.mask_token_id).sum(dim=1) == 1)
          print("VALIDATION PASSED: 1000 embeddings, UMAP, 108 masked sites and 20x108 replacement scores")
          print("Python:", platform.python_version())
          print({p: version(p) for p in ("torch", "transformers", "datasets", "umap-learn", "numpy", "pandas")})
          """))
          start = time.monotonic()
          output = Path("validation-output")
          output.mkdir()
          def progress(cell, cell_index, **kwargs):
              if cell.cell_type == "code":
                  print(f"Executing cell {cell_index + 1}/{len(notebook.cells)}", flush=True)
          try:
              with tempfile.TemporaryDirectory() as empty:
                  NotebookClient(
                      notebook, timeout=1200, kernel_name="python3",
                      resources={"metadata": {"path": empty}},
                      on_cell_start=progress,
                  ).execute()
          finally:
              nbformat.write(notebook, output / "ProteinLM_practice_executed.ipynb")
          print("Elapsed seconds:", round(time.monotonic() - start, 1))
          for item in notebook.cells[-1].get("outputs", []):
              if item.output_type == "stream":
                  print(item.text)
          PY
      - name: Retain the executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-10-execution
          path: validation-output/
          retention-days: 7

